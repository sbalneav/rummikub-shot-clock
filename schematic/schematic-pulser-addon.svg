<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480"><style>
.w, .c { fill: none; stroke: #1d2528; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.c { stroke-width: 2.2; }
.thick { stroke-width: 4; }
.ic { fill: #ffffff; stroke: #1d2528; stroke-width: 2.2; }

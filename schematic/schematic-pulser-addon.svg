.pin { font-size: 10px; fill: #5d686c; }
.pfn { font-size: 11px; fill: #5d686c; }
.icname { font: 600 15px monospace; }
.icpart { font-size: 12px; fill: #5d686c; }
.plus { font-size: 15px; font-weight: 600; }
.rail { font-size: 12px; font-weight: 600; fill: #d0261d; }
.net { font-size: 11px; font-weight: 600; fill: #d0261d; letter-spacing: .08em; }
.cap { font-size: 12px; font-weight: 600; letter-spacing: .08em; fill: #5d686c; }
.flagt { font-size: 12px; font-weight: 600; fill: #d0261d; }

